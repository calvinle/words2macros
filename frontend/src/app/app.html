<mat-toolbar>
  <h1 class="brand">words2macros</h1>
</mat-toolbar>

<main>
  <app-meal-input [busy]="busy()" (submitted)="onSubmit($event)" />

  <!-- Temporary: raw output for testing. Steps 4 and 5 replace this. -->
  <section aria-live="polite">
    @if (busy()) {
      <p>Calculating...</p>
    }
    @if (error(); as e) {
      <p role="alert">{{ e.code }}: {{ e.message }}</p>
    }
    @if (result(); as r) {
      <pre>{{ r | json }}</pre>
    }
  </section>
</main>

<footer>
  Values from USDA FoodData Central. Estimated amounts may be off by 20-30%.
</footer>
