<mat-toolbar class="app-bar">
  <h1 class="brand">words2macros</h1>
  <span class="spacer"></span>
  @let dark = theme.theme() === 'dark';
  <button
    mat-icon-button
    type="button"
    (click)="theme.toggle()"
    [attr.aria-label]="dark ? 'Switch to light mode' : 'Switch to dark mode'"
    [title]="dark ? 'Light mode' : 'Dark mode'"
  >
    <!-- Separate branches so the new icon is a fresh element that plays its enter animation. -->
    @if (dark) {
      <mat-icon animate.enter="icon-enter">light_mode</mat-icon>
    } @else {
      <mat-icon animate.enter="icon-enter">dark_mode</mat-icon>
    }
  </button>
</mat-toolbar>

<main>
  <app-meal-input
    [busy]="store.busy()"
    [initialText]="store.draft()"
    (submitted)="store.submit($event)"
    (textChange)="store.draft.set($event)"
  />

  <!-- Loading and errors announce themselves; this tells screen readers a result arrived. -->
  <p class="visually-hidden" role="status">
    {{ store.result() && !store.busy() ? 'Results ready.' : '' }}
  </p>

  <section class="results" #results>
    @if (store.busy()) {
      <app-loading-status />
    }
    @if (store.error(); as e) {
      <app-error-panel [error]="e" (retry)="store.retry()" (edit)="editDescription()" />
    }
    @if (store.result(); as r) {
      <app-meal-result
        [result]="r"
        [stale]="store.stale()"
        [class.dimmed]="store.busy()"
        [attr.aria-busy]="store.busy()"
        [attr.inert]="store.busy() ? '' : null"
      />
    }
  </section>
</main>

<footer>Values from USDA FoodData Central. Estimated amounts may be off by 20-30%.</footer>
