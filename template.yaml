AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: words2macros - turns a meal description into validated macros

Parameters:
  ModelName:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model, called through its global cross-Region inference profile
  UsdaKeyParameter:
    Type: String
    Default: /words2macros/usda-api-key
    Description: SSM SecureString holding the USDA API key (created outside this template)
  KillSwitchInvocationsPer5Min:
    Type: Number
    Default: 60
    Description: Stop the analyze function if it runs more than this many times in 5 minutes

Resources:
  AnalyzeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        # Only the hosted site and the local dev server may call the API from a browser.
        AllowOrigins:
          - !Sub https://${SiteDistribution.DomainName}
          - http://localhost:4200
        AllowMethods: [POST]
        AllowHeaders: [content-type]
      DefaultRouteSettings:
        # Public endpoint with no login: cap how fast Bedrock costs can grow.
        ThrottlingRateLimit: 1
        ThrottlingBurstLimit: 2

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: words2macros.handler.lambda_handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 29 # just under the HTTP API's 30-second limit
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Sub global.${ModelName}
          USDA_API_KEY_PARAMETER: !Ref UsdaKeyParameter
      Policies:
        - Statement:
            - Sid: ReadUsdaKey
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${UsdaKeyParameter}
            # Global cross-Region inference needs all three parts:
            # https://docs.aws.amazon.com/bedrock/latest/userguide/global-cross-region-inference.html
            - Sid: InvokeGlobalProfile
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${ModelName}
              Condition:
                StringEquals:
                  aws:RequestedRegion: !Ref AWS::Region
            - Sid: InvokeRegionalModelThroughProfile
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${ModelName}
              Condition:
                StringEquals:
                  aws:RequestedRegion: !Ref AWS::Region
                  bedrock:InferenceProfileArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${ModelName}
            - Sid: InvokeGlobalModelThroughProfile
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:::foundation-model/${ModelName}
              Condition:
                StringEquals:
                  aws:RequestedRegion: unspecified
                  bedrock:InferenceProfileArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${ModelName}
      Events:
        Analyze:
          Type: HttpApi
          Properties:
            ApiId: !Ref AnalyzeApi
            Path: /analyze
            Method: POST

  AnalyzeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AnalyzeFunction}
      RetentionInDays: 7

  # --- Cost kill switch (fast): alarm on invocation spikes -> set concurrency to 0 ---

  KillSwitchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: words2macros.killswitch.lambda_handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TARGET_FUNCTION: !Ref AnalyzeFunction
      Policies:
        - Statement:
            - Sid: StopAnalyzeFunction
              Effect: Allow
              Action: lambda:PutFunctionConcurrency
              Resource: !GetAtt AnalyzeFunction.Arn

  KillSwitchLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${KillSwitchFunction}
      RetentionInDays: 7

  CostSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-cost-spike
      AlarmDescription: Analyze function ran unusually often; the kill switch stops it.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyzeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref KillSwitchInvocationsPer5Min
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !GetAtt KillSwitchFunction.Arn

  KillSwitchAlarmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref KillSwitchFunction
      Action: lambda:InvokeFunction
      Principal: lambda.alarms.cloudwatch.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt CostSpikeAlarm.Arn

  # --- Pieces for the AWS Budgets action (slow insurance), configured in the console ---

  DenyBedrockPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${AWS::StackName}-deny-bedrock
      Description: Attached to the analyze function's role by a Budgets action to stop AI spend.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Action: bedrock:*
            Resource: "*"

  BudgetsActionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets AWS Budgets attach or detach only the deny-bedrock policy on the analyze role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: attach-deny-bedrock-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !GetAtt AnalyzeFunctionRole.Arn
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Ref DenyBedrockPolicy

  # --- Frontend hosting: a private S3 bucket that only CloudFront can read ---
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: words2macros frontend
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100 # North America and Europe edges only; cheapest
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: "" # empty: OAC is used instead of the older OAI
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # AWS managed policies. CachingOptimized follows each file's Cache-Control
          # header (set by scripts/deploy-frontend.sh); SecurityHeadersPolicy adds
          # HSTS, X-Content-Type-Options, X-Frame-Options and Referrer-Policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

Outputs:
  AnalyzeUrl:
    Description: POST meal descriptions here
    Value: !Sub https://${AnalyzeApi}.execute-api.${AWS::Region}.amazonaws.com/analyze
  ReenableCommand:
    Description: Run this after the kill switch has stopped the analyze function
    Value: !Sub aws lambda delete-function-concurrency --function-name ${AnalyzeFunction}
  SiteUrl:
    Description: The hosted frontend
    Value: !Sub https://${SiteDistribution.DomainName}
  SiteBucket:
    Description: Upload the built frontend here (scripts/deploy-frontend.sh does this)
    Value: !Ref SiteBucket
